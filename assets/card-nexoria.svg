
<svg width="800" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cardGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221D40"/>
      <stop offset="100%" stop-color="#1B1832"/>
    </linearGradient>
    <radialGradient id="iconBg" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#3A2F63"/>
      <stop offset="100%" stop-color="#221D40"/>
    </radialGradient>
    <linearGradient id="needleWarm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2B45B"/>
      <stop offset="100%" stop-color="#D98E2B"/>
    </linearGradient>
    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A2A12"/>
      <stop offset="100%" stop-color="#43300F"/>
    </linearGradient>
    <filter id="soft5" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0A0818" flood-opacity="0.45"/>
    </filter>
    <filter id="needleGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#D98E2B" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="788" height="138" rx="18" fill="url(#cardGrad5)" stroke="#3A3462" stroke-width="1.2" filter="url(#soft5)"/>

  <!-- compass icon -->
  <circle cx="66" cy="75" r="40" fill="url(#iconBg)" stroke="#4A4470" stroke-width="1.5"/>
  <circle cx="66" cy="75" r="30" fill="none" stroke="#5B5490" stroke-width="1"/>

  <!-- tick marks N E S W -->
  <line x1="66" y1="41" x2="66" y2="47" stroke="#8B7FD1" stroke-width="2" stroke-linecap="round"/>
  <line x1="66" y1="103" x2="66" y2="109" stroke="#8B7FD1" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="75" x2="38" y2="75" stroke="#8B7FD1" stroke-width="2" stroke-linecap="round"/>
  <line x1="94" y1="75" x2="100" y2="75" stroke="#8B7FD1" stroke-width="2" stroke-linecap="round"/>

  <!-- needle -->
  <g transform="rotate(-25 66 75)" filter="url(#needleGlow)">
    <polygon points="66,50 72,75 66,70 60,75" fill="url(#needleWarm)"/>
    <polygon points="66,100 72,75 66,80 60,75" fill="#8B7FD1"/>
  </g>
  <circle cx="66" cy="75" r="4.5" fill="#F7F5EF"/>

  <text x="128" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#F7F5EF">Nexoria</text>

  <rect x="228" y="36" width="118" height="25" rx="12.5" fill="url(#pillGrad2)" stroke="#D98E2B" stroke-width="1"/>
  <circle cx="243" cy="48.5" r="3" fill="#F2B45B"/>
  <text x="253" y="52.5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#F2B45B">EN DESARROLLO</text>

  <text x="128" y="78" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B7ACDD">Nueva aplicación personal en desarrollo. Muy pronto más detalles</text>
  <text x="128" y="96" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B7ACDD">sobre qué resuelve y cómo está construida.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#C9BFE8">
    <rect x="128" y="110" width="54" height="24" rx="12" fill="#2E2851"/>
    <text x="155" y="126" text-anchor="middle">React</text>
    <rect x="190" y="110" width="90" height="24" rx="12" fill="#2E2851"/>
    <text x="235" y="126" text-anchor="middle">TypeScript</text>
    <rect x="288" y="110" width="80" height="24" rx="12" fill="#2E2851"/>
    <text x="328" y="126" text-anchor="middle">Node.js</text>
    <rect x="376" y="110" width="86" height="24" rx="12" fill="#2E2851"/>
    <text x="419" y="126" text-anchor="middle">Supabase</text>
  </g>
</svg>
